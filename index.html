<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الإيجارات</title>
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #121212;
            --surface: #1E1E1E;
            --card: #2A2A2A;
            --primary: #FFD700;
            --text: #ffffff;
            --muted: #b0b0b0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; }
        header { display: flex; justify-content: space-between; align-items: center; background: #181818; padding: 15px; border-radius: 10px; border: 1px solid var(--primary); margin-bottom: 15px; }
        h1 { color: var(--primary); font-size: 20px; }
        .btn { background: var(--primary); color: #000; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-outline { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
        .category-card { background: var(--surface); border: 1px solid var(--primary); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
        .category-header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; cursor: pointer; }
        .category-info h3 { color: var(--primary); font-size: 16px; margin-bottom: 3px; }
        .category-info p { color: var(--muted); font-size: 12px; }
        .tenants-list { display: none; padding: 12px; flex-direction: column; gap: 8px; border-top: 1px solid #333; }
        .tenant-item { background: var(--card); padding: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .tenant-details h4 { color: var(--primary); font-size: 14px; }
        .tenant-details p { color: var(--muted); font-size: 12px; }
        .tenant-actions { display: flex; gap: 8px; align-items: center; }
        .icon-btn { background: none; border: none; cursor: pointer; font-size: 18px; }
        .check-btn { color: #777; }
        .check-btn.paid { color: #00e676; }
        .delete-btn { color: #ff4d4d; }
        /* النوافذ المنبثقة */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--surface); padding: 20px; border-radius: 10px; border: 1px solid var(--primary); width: 90%; max-width: 350px; display: flex; flex-direction: column; gap: 12px; }
        .modal-content h2 { color: var(--primary); font-size: 16px; }
        .form-control { display: flex; flex-direction: column; gap: 4px; }
        .form-control label { color: var(--primary); font-size: 12px; }
        .form-control input { padding: 8px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; outline: none; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; }
        .empty-state { text-align: center; color: var(--muted); margin-top: 40px; font-size: 14px; }
        /* زر الإضافة العائم */
        .fab { position: fixed; bottom: 20px; left: 20px; width: 50px; height: 50px; background: var(--primary); color: #000; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; border: none; }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-building"></i> إدارة الايجارات</h1>
        <button class="btn btn-outline" style="font-size: 12px; padding: 6px 10px;" onclick="resetAllMonths()"><i class="fa-solid fa-rotate"></i> تصفير</button>
    </header>

    <div id="app"></div>
    <div id="emptyState" class="empty-state" style="display: none;">لا توجد قوائم. اضغط على زر + لإضافة قائمة جديدة</div>

    <button class="fab" onclick="openModal('categoryModal')"><i class="fa-solid fa-plus"></i></button>

    <!-- نافذة إضافة قائمة -->
    <div id="categoryModal" class="modal">
        <div class="modal-content">
            <h2>إضافة قائمة جديدة</h2>
            <div class="form-control">
                <label>اسم القائمة</label>
                <input type="text" id="catName" placeholder="مثال: عمارة أ">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-outline" onclick="closeModal('categoryModal')">إلغاء</button>
                <button class="btn" onclick="saveCategory()">إضافة</button>
            </div>
        </div>
    </div>

    <!-- نافذة إضافة مؤجر -->
    <div id="tenantModal" class="modal">
        <div class="modal-content">
            <h2>إضافة مؤجر</h2>
            <div class="form-control">
                <label>اسم المؤجر</label>
                <input type="text" id="tName" placeholder="الاسم">
            </div>
            <div class="form-control">
                <label>رقم الهاتف</label>
                <input type="tel" id="tPhone" placeholder="الهاتف">
            </div>
            <div class="form-control">
                <label>سعر الإيجار</label>
                <input type="number" id="tPrice" placeholder="المبلغ">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-outline" onclick="closeModal('tenantModal')">إلغاء</button>
                <button class="btn" onclick="saveTenant()">حفظ</button>
            </div>
        </div>
    </div>

    <script>
        let categories = JSON.parse(localStorage.getItem('rent_data')) || [];
        let activeCatIndex = null;

        function saveData() {
            localStorage.setItem('rent_data', JSON.stringify(categories));
            render();
        }

        function render() {
            const app = document.getElementById('app');
            const empty = document.getElementById('emptyState');
            app.innerHTML = '';

            if (categories.length === 0) {
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            categories.forEach((cat, cIdx) => {
                let total = cat.tenants.reduce((sum, t) => sum + Number(t.price), 0);
                let paid = cat.tenants.filter(t => t.hasPaid).reduce((sum, t) => sum + Number(t.price), 0);

                let tenantsHtml = '';
                cat.tenants.forEach((t, tIdx) => {
                    tenantsHtml += `
                        <div class="tenant-item">
                            <div class="tenant-details">
                                <h4>${t.name}</h4>
                                <p>الهاتف: ${t.phone || '-'} | الإيجار: ${t.price} ر.س</p>
                            </div>
                            <div class="tenant-actions">
                                <button class="icon-btn check-btn ${t.hasPaid ? 'paid' : ''}" onclick="togglePaid(${cIdx}, ${tIdx})">
                                    <i class="fa-solid fa-circle-check"></i>
                                </button>
                                <button class="icon-btn delete-btn" onclick="deleteTenant(${cIdx}, ${tIdx})">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>`;
                });

                let card = document.createElement('div');
                card.className = 'category-card';
                card.innerHTML = `
                    <div class="category-header" onclick="toggleList(this)">
                        <div class="category-info">
                            <h3><i class="fa-solid fa-folder-open"></i> ${cat.name}</h3>
                            <p>الإجمالي: ${total} ر.س | المحصل: ${paid} ر.س</p>
                        </div>
                        <div class="tenant-actions" onclick="event.stopPropagation()">
                            <button class="btn" style="padding: 4px 8px; font-size: 11px;" onclick="openTenantModal(${cIdx})">+ مؤجر</button>
                            <button class="icon-btn delete-btn" onclick="deleteCategory(${cIdx})"><i class="fa-solid fa-trash"></i></button>
                            <i class="fa-solid fa-chevron-down" style="color: var(--primary);"></i>
                        </div>
                    </div>
                    <div class="tenants-list">
                        ${tenantsHtml || '<p style="text-align:center; color:var(--muted); font-size:12px;">لا يوجد مؤجرين</p>'}
                    </div>`;
                app.appendChild(card);
            });
        }

        function toggleList(header) {
            let list = header.nextElementSibling;
            let icon = header.querySelector('.fa-chevron-down');
            if (list.style.display === 'flex') {
                list.style.display = 'none';
                icon.style.transform = 'rotate(0deg)';
            } else {
                list.style.display = 'flex';
                icon.style.transform = 'rotate(180deg)';
            }
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function saveCategory() {
            let name = document.getElementById('catName').value.trim();
            if (!name) return;
            categories.push({ name: name, tenants: [] });
            document.getElementById('catName').value = '';
            closeModal('categoryModal');
            saveData();
        }

        function deleteCategory(cIdx) {
            if (confirm('حذف القائمة بالكامل؟')) {
                categories.splice(cIdx, 1);
                saveData();
            }
        }

        function openTenantModal(cIdx) {
            activeCatIndex = cIdx;
            document.getElementById('tName').value = '';
            document.getElementById('tPhone').value = '';
            document.getElementById('tPrice').value = '';
            openModal('tenantModal');
        }

        function saveTenant() {
            let name = document.getElementById('tName').value.trim();
            let phone = document.getElementById('tPhone').value.trim();
            let price = document.getElementById('tPrice').value.trim();
            if (!name || !price) return;

            categories[activeCatIndex].tenants.push({ name, phone, price: Number(price), hasPaid: false });
            closeModal('tenantModal');
            saveData();
        }

        function deleteTenant(cIdx, tIdx) {
            categories[cIdx].tenants.splice(tIdx, 1);
            saveData();
        }

        function togglePaid(cIdx, tIdx) {
            categories[cIdx].tenants[tIdx].hasPaid = !categories[cIdx].tenants[tIdx].hasPaid;
            saveData();
        }

        function resetAllMonths() {
            if (confirm('تصفير حالة الدفع للجميع؟')) {
                categories.forEach(c => c.tenants.forEach(t => t.hasPaid = false));
                saveData();
            }
        }

        window.onload = render;
    </script>
</body>
</html>
